{% extends "root_email_template_new.html" %}
{% comment %}
Sent to a form's notification recipients when a submission is accepted.

Every value in `submission.payload` is submitter-controlled. Django autoescapes
`{{ }}` output, which is what keeps a submitted `<script>` from becoming one in
a colleague's mail client. DO NOT add `|safe` anywhere in this template, and do
not switch the table to `{% autoescape off %}`.
{% endcomment %}
{% block preheader %}New submission through {{ form.name }}{% endblock %}
{% block heading %}New website submission{% endblock %}
{% block content_body %}
    <p style="margin: 0 0 16px;">
      A new submission arrived through <strong>{{ form.name }}</strong>.
    </p>

    {% if is_duplicate %}
      <p style="margin: 0 0 16px; padding: 12px; background: #fffbeb; border-radius: 6px; color: #92400e;">
        This submission is linked to an existing record.
        {% if form.target_model == "Contact" %}Its details and owner were left unchanged.
        {% else %}New details were merged into blank fields only.{% endif %}
      </p>
    {% endif %}

    <table cellpadding="8" cellspacing="0" style="border-collapse: collapse; margin: 0 0 20px;">
      {% for key, value in submission.payload.items %}
        <tr>
          <td style="border-bottom: 1px solid {{ email_theme.border }}; vertical-align: top;">
            <strong>{{ key }}</strong>
          </td>
          <td style="border-bottom: 1px solid {{ email_theme.border }}; vertical-align: top;">
            {{ value }}
          </td>
        </tr>
      {% endfor %}
    </table>

{% endblock %}
{% block button_link %}{% if record %}<a class="btn-link" href="{{ record_url }}" style="{{ email_theme.button_style }}">Open {{ form.target_model|lower }}</a>{% endif %}{% endblock %}
