<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico?v=20261009" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/brand/hdm-favicon.png?v=20261009"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/brand/hdm-apple-touch-icon.png?v=20261009"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script nonce="%sveltekit.nonce%">
      // Apply the saved appearance before paint; mode-watcher manages subsequent changes.
      try {
        const preference = localStorage.getItem('mode-watcher-mode');
        const dark = preference === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        // Older system-following choices must not turn the CRM dark automatically.
        if (preference !== 'dark' && preference !== 'light') {
          localStorage.setItem('mode-watcher-mode', 'light');
        }
      } catch {
        // Keep the default light appearance when browser storage is unavailable.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
