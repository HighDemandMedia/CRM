name: Security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Audit locked Python dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt" >/dev/null
          uv tool run pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.17.0
      - name: Audit all web dependencies, including bundled server dependencies
        working-directory: frontend
        run: |
          pnpm audit --json > "$RUNNER_TEMP/npm-audit.json" || test "$?" -eq 1
          python3 ../scripts/security/check_npm_audit.py "$RUNNER_TEMP/npm-audit.json" ../.github/security/npm-audit-exceptions.json
      - name: Check audit gate behavior
        run: python3 -m unittest discover -s scripts/security -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full fetched history without printing secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .'
